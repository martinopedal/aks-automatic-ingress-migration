name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: [self-hosted, personal, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: terraform fmt
        run: |
          if [ -d infra/terraform ]; then
            terraform -chdir=infra/terraform fmt -check -recursive
          fi
      - name: terraform validate
        run: |
          if [ -d infra/terraform ]; then
            terraform -chdir=infra/terraform init -backend=false
            terraform -chdir=infra/terraform validate
          fi

  bicep:
    runs-on: [self-hosted, personal, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install bicep
        run: az bicep install
      - name: bicep build + lint
        run: |
          if [ -d infra/bicep ]; then
            find infra/bicep -name '*.bicep' -print0 | xargs -0 -n1 az bicep build --file
          fi

  manifests:
    runs-on: [self-hosted, personal, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform manifests
        run: |
          if [ -d manifests ]; then
            find manifests -name '*.yaml' -print0 | xargs -0 -r kubeconform -strict -ignore-missing-schemas
          fi
      - name: helm lint
        run: |
          if [ -d charts ]; then
            for c in charts/*/; do helm lint "$c"; done
          fi
